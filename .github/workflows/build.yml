name: Build LastWave APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Android 10 Release APKs (compressed + raw)
        env:
          LOSSLESS_BACKEND_URL: ${{ secrets.LOSSLESS_BACKEND_URL }}
          LOSSLESS_API_KEY: ${{ secrets.LOSSLESS_API_KEY }}
          LYRICS_API_KEY: ${{ secrets.LYRICS_API_KEY }}
          PROVIDER_MODULE_KEY: ${{ secrets.PROVIDER_MODULE_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleRawRelease --stacktrace

      - name: Show generated APKs
        if: always()
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Sign Release APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign Raw APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_raw
        with:
          releaseDirectory: app/build/outputs/apk/rawRelease
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 10 Final APKs
        id: prep_apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final_apk

          VERSION=$(grep 'versionName = ' app/build.gradle.kts \
            | head -n1 \
            | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION="${VERSION:-4.1.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building APKs for LastWave v$VERSION"

          release_dir="app/build/outputs/apk/release"
          raw_dir="app/build/outputs/apk/rawRelease"

          release_apk=""
          if [[ -d "$release_dir" ]]; then
            release_apk=$(find "$release_dir" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*-mapping.apk' | sort | head -n1)
          fi

          raw_apk=""
          if [[ -d "$raw_dir" ]]; then
            raw_apk=$(find "$raw_dir" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*-mapping.apk' | sort | head -n1)
          fi

          if [[ -z "$release_apk" ]]; then
            echo "::error::No release APK was generated"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          if [[ -z "$raw_apk" ]]; then
            echo "::error::No raw release APK was generated"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$release_apk" "final_apk/LastWave-v${VERSION}-release.apk"
          cp "$raw_apk" "final_apk/LastWave-v${VERSION}-raw.apk"

          rm -rf app/build/outputs/apk/release/*
          echo "Staged:"
          ls -lh final_apk

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          LOSSLESS_BACKEND_URL: ${{ secrets.LOSSLESS_BACKEND_URL }}
          LOSSLESS_API_KEY: ${{ secrets.LOSSLESS_API_KEY }}
          LYRICS_API_KEY: ${{ secrets.LYRICS_API_KEY }}
          PROVIDER_MODULE_KEY: ${{ secrets.PROVIDER_MODULE_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PminSdk=24 --stacktrace

      - name: Sign Android 7 Legacy APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_legacy
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 7 Final APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.prep_apk.outputs.version }}"
          release_dir="app/build/outputs/apk/release"

          legacy_apk=""
          if [[ -d "$release_dir" ]]; then
            legacy_apk=$(find "$release_dir" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*-mapping.apk' | sort | head -n1)
          fi

          if [[ -z "$legacy_apk" ]]; then
            echo "::error::No Android 7 release APK was generated"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$legacy_apk" "final_apk/LastWave-v${VERSION}-android7.apk"
          ls -lh final_apk/

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-v${{ steps.prep_apk.outputs.version }}-APKs
          path: final_apk/*.apk
          if-no-files-found: error
